{% extends 'base.html' %} {% block content %}
<div class="container">
  <div class="row">
    <h1>Login / Sign up</h1>
  </div>
</div>

<div class="container">
  <div class="row">
    <form action="{{ url_for('login') }}" method="POST" class="box">
      {% if message %}
      <div class="alert alert-warning" role="alert">{{ message }}</div>
      {% endif %}

      <div class="col-auto">
        <label for="email" class="form-label">Email address</label>
        <input
          name="email"
          type="email"
          class="form-control"
          id="email"
          placeholder="name@example.com"
          required
        />
      </div>

      <div class="col-auto">
        <label for="password" class="form-label">Password</label>
        <input
          name="password"
          type="password"
          class="form-control"
          id="password"
          required
        />
      </div>

      <div class="mt-3 d-flex gap-2">
        <button
          type="submit"
          name="action"
          value="login"
          class="btn btn-primary"
        >
          Login
        </button>
        <button
          type="submit"
          name="action"
          value="signup"
          class="btn btn-outline-secondary"
        >
          Sign up
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
